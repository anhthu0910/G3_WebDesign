services:
  - type: web
    name: glowguide
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_PATH
        value: /var/data/glowguide.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODELS
        sync: false
    disk:
      name: glowguide-data
      mountPath: /var/data
      sizeGB: 1
