<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login | GlowGuide</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/auth.css" />
    <script src="../js/auth.js" defer></script>
    <script src="../js/login.js" defer></script>
    <script src="../js/main.js" defer></script>
  </head>
  <body>
    <header class="navbar">
      <a href="index.html" class="logo">GlowGuide</a>
      <nav>
        <a href="index.html">Home</a><a href="products.html">Products</a
        ><a href="skin_quiz.html">Skin Quiz</a
        ><a href="ai_consultant.html">AI Consultant</a
        ><a href="cart.html">Cart</a>
      </nav>
    </header>
    <main class="auth-page">
      <section class="auth-card">
        <h1>Login to GlowGuide</h1>
        <div class="login-role-choice">
          <button type="button" class="role-button active" data-role="user">
            User</button
          ><button type="button" class="role-button" data-role="admin">
            Admin
          </button>
        </div>
        <form id="loginForm">
          <input id="loginRole" type="hidden" value="user" /><label
            for="identifier"
            >Email or Username</label
          ><input id="identifier" required autocomplete="username" /><label
            for="password"
            >Password</label
          ><input
            id="password"
            type="password"
            required
            autocomplete="current-password"
          /><label class="show-password"
            ><input id="showPassword" type="checkbox" /> Show password</label
          ><button id="loginButton">Login as User</button>
        </form>
        <p id="authMessage" class="auth-message"></p>
        <p class="auth-footer-text">
          Don't have an account? <a href="register.html">Sign Up</a>
        </p>
        <a class="guest-link" href="index.html">Continue as Guest</a>
      </section>
    </main>
  </body>
</html>
