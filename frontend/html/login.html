<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login | GlowGuide</title>
  <link rel="stylesheet" href="/frontend/css/style.css?v=20261111-home-buy-now">
  <link rel="stylesheet" href="/frontend/css/auth.css?v=20261111-login-spacing">
  <script src="/frontend/js/auth.js?v=20261111-login-navigation" defer></script>
  <script src="/frontend/js/login.js?v=20261112-null-guard" defer></script>
  <script src="/frontend/js/main.js" defer></script>
  <script src="/frontend/js/cart.js" defer></script>
</head>
<body>
  <header class="navbar">
    <a href="/frontend/html/index.html" class="logo">GlowGuide</a>
    <nav>
      <a href="/frontend/html/index.html">Home</a><a href="/frontend/html/products.html">Products</a>
      <a href="/frontend/html/skin_quiz.html">Skin Quiz</a><a href="/frontend/html/ai_consultant.html">AI Consultant</a>
      <a href="/frontend/html/cart.html">Cart</a>
      <span id="accountArea"><a href="/login">Login / Sign Up</a></span>
    </nav>
  </header>
  <main class="auth-page"><section class="auth-card">
    <h1>Login to GlowGuide</h1>
    <form id="loginForm" data-login-role="user">
      <label for="identifier">Email or Username</label><input id="identifier" required autocomplete="username">
      <label for="password">Password</label><input id="password" type="password" required autocomplete="current-password">
      <label class="show-password"><input id="showPassword" type="checkbox"> Show password</label>
      <button id="loginButton">Login</button>
    </form>
    <p id="authMessage" class="auth-message" role="status"></p>
    <p class="auth-footer-text">Don't have an account? <a href="/frontend/html/register.html">Sign Up</a></p>
    <a class="guest-link" href="/frontend/html/index.html">Continue as Guest</a>
    <p class="auth-footer-text"><a href="/admin/login">Admin Login</a></p>
  </section></main>
</body>
</html>
