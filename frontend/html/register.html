<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sign Up | GlowGuide</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/auth.css" />
    <script src="../js/auth.js" defer></script>
    <script src="../js/register.js" defer></script>
    <script src="../js/main.js" defer></script>
  </head>
  <body>
    <header class="navbar">
      <a href="index.html" class="logo">GlowGuide</a>
      <nav>
        <a href="index.html">Home</a><a href="products.html">Products</a
        ><a href="skin_quiz.html">Skin Quiz</a
        ><a href="ai_consultant.html">AI Consultant</a
        ><a href="cart.html">Cart</a>
      </nav>
    </header>
    <main class="auth-page">
      <section class="auth-card">
        <h1>Create Your Account</h1>
        <form id="registerForm">
          <label for="username">Username</label
          ><input id="username" minlength="3" maxlength="50" required /><label
            for="email"
            >Email</label
          ><input id="email" type="email" required /><label for="password"
            >Password</label
          ><input id="password" type="password" minlength="8" required /><label
            for="confirmPassword"
            >Confirm Password</label
          ><input
            id="confirmPassword"
            type="password"
            minlength="8"
            required
          /><button id="registerButton">Create Account</button>
        </form>
        <p id="authMessage" class="auth-message"></p>
        <p class="auth-footer-text">
          Already have an account? <a href="login.html">Login</a>
        </p>
        <a class="guest-link" href="index.html">Continue as Guest</a>
      </section>
    </main>
  </body>
</html>
